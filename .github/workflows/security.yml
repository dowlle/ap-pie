name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ap-web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ap-web/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ap-web/requirements.txt
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r ap-web/requirements.txt

  backend-security-controls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: archipelago
          POSTGRES_PASSWORD: security-test-only
          POSTGRES_DB: archipelago
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archipelago"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://archipelago:security-test-only@localhost:5432/archipelago
      SECRET_KEY: security-test-key-long
      AP_CORS_ORIGINS: http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ap-web/requirements.txt
      - run: python -m pip install -r ap-web/requirements.txt ./ap-lib
      - run: python scripts/check_analytics.py
      - run: python scripts/check_analytics_scorecard.py
      - run: python scripts/test_security_controls.py
      - run: python scripts/test_open_room_creation.py
      - run: python scripts/test_account_lifecycle.py
      - run: python scripts/test_apworld_options_parser.py
      # OPS-21 refresh endpoint: auth fails closed, and a failed git sync
      # can't report success. Needs no database, but rides along here so
      # there is one place that runs the backend checks.
      - run: python scripts/test_index_refresh.py
