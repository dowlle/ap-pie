services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archipelago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: archipelago
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archipelago"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ap-web:
    build:
      context: .
      dockerfile: ap-web/Dockerfile
    ports:
      # Flask is bound to localhost only - Caddy proxies it from the host.
      # Without this, port 5001 would bind to 0.0.0.0 and let direct hits
      # bypass Caddy's TLS, rate limits, and (when paired with arbitrary
      # X-Forwarded-For headers) the per-IP submit cap. Audit-2026-05-04 #2.
      - "127.0.0.1:5001:5001"
    volumes:
      - ./data/output:/data/output
      - ap-state:/app/.state
      - ${AP_INSTALL_PATH:-~/archipelago-install/Archipelago}:/opt/archipelago:ro
      - ap-worlds:/opt/archipelago-custom/worlds
      - ap-worlds:/home/apweb/.local/share/Archipelago/worlds
    environment:
      - AP_OUTPUT_DIR=/data/output
      - AP_HOST=${AP_HOST:-localhost}
      - AP_SERVER_EXE=/opt/archipelago/ArchipelagoServer
      - AP_GENERATOR_EXE=/opt/archipelago/ArchipelagoGenerate
      - AP_WORLDS_DIR=/opt/archipelago-custom/worlds
      - AP_DEBUG=0
      - AP_CORS_ORIGINS=${AP_CORS_ORIGINS:-https://ap-pie.com}
      - DATABASE_URL=postgresql://archipelago:${POSTGRES_PASSWORD}@postgres:5432/archipelago
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - AP_OWNER_DISCORD_ID=${AP_OWNER_DISCORD_ID}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      # APIE-1 ap-pie-wide SSO. Both empty by default = host-only "session"
      # cookie (unchanged). Prod sets DOMAIN=.ap-pie.com + NAME=apie_session
      # with the shared ecosystem SECRET_KEY; beta sets a distinct NAME (no
      # domain) to stay isolated. digipelago/pokepelago reuse the prod values.
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-}
      - FEATURE_GENERATION=${FEATURE_GENERATION:-true}
      - FEATURE_OPEN_ROOM_CREATION=${FEATURE_OPEN_ROOM_CREATION:-false}
      - AP_ROOM_CREATION_PER_HOUR=${AP_ROOM_CREATION_PER_HOUR:-5}
      - AP_ROOM_CREATION_MAX_ACTIVE=${AP_ROOM_CREATION_MAX_ACTIVE:-10}
      - AP_ROOM_CREATION_MAX_TOTAL=${AP_ROOM_CREATION_MAX_TOTAL:-50}
      - AP_ACCOUNT_DELETION_GRACE_DAYS=${AP_ACCOUNT_DELETION_GRACE_DAYS:-7}
      - AP_ACCOUNT_ERASURE_RECEIPT_DAYS=${AP_ACCOUNT_ERASURE_RECEIPT_DAYS:-16}
      - AP_ACCOUNT_ERASURE_LEDGER=/app/.state/account-erasure-receipts.jsonl
      # OPS-07: deployment label drives the DeploymentBanner. Empty = prod
      # (no banner). Set to "beta" on the beta stack so testers see a
      # persistent visual cue and never confuse the two.
      - AP_DEPLOYMENT_LABEL=${AP_DEPLOYMENT_LABEL:-}
      # OPS-21: lets the index-merge pipeline POST /api/apworlds/refresh so a
      # merged world appears without the manual in-container refresh. Empty
      # by default = admin-session-only, i.e. today's behaviour. Generate
      # with `python3 -c 'import secrets; print(secrets.token_hex(32))'`;
      # values under 32 chars are refused at request time.
      - AP_INDEX_REFRESH_TOKEN=${AP_INDEX_REFRESH_TOKEN:-}
      - AP_ANALYTICS_EVENTS_GLOBAL_PER_MINUTE=${AP_ANALYTICS_EVENTS_GLOBAL_PER_MINUTE:-600}
      - AP_TRUST_CLOUDFLARE_HEADERS=${AP_TRUST_CLOUDFLARE_HEADERS:-false}
      # FEAT-17 V0: real-time WebSocket tracker. Off by default; flip to
      # 1 in the server .env to enable. AP_TRACKER_WS_MAX caps connection
      # count, AP_TRACKER_WS_IDLE_MINUTES controls auto-disconnect.
      - AP_TRACKER_WS_ENABLED=${AP_TRACKER_WS_ENABLED:-0}
      - AP_TRACKER_WS_MAX=${AP_TRACKER_WS_MAX:-200}
      - AP_TRACKER_WS_IDLE_MINUTES=${AP_TRACKER_WS_IDLE_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
  ap-state:
  ap-worlds:
