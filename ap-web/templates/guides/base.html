<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ meta_description }}" />
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="{{ og_type|default('article') }}" />
    <meta property="og:title" content="{{ og_title|default(page_title) }}" />
    <meta property="og:description" content="{{ og_description|default(meta_description) }}" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:site_name" content="Archipelago Pie" />
    {% if og_image %}
    <meta property="og:image" content="{{ og_image }}" />
    <meta name="twitter:card" content="summary_large_image" />
    {% endif %}
    <meta name="theme-color" content="#121016" />

    {% if structured_data %}
    <script type="application/ld+json">{{ structured_data|tojson }}</script>
    {% endif %}

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      :root {
        --color-canvas: #121016;
        --color-surface: #1b181f;
        --color-surface-raised: #242029;
        --color-border: #332d39;
        --color-border-strong: #49404f;
        --color-text: #f5f1eb;
        --color-text-muted: #a59c91;
        --color-text-subtle: #746d68;
        --color-accent: #f2ad55;
        --color-accent-strong: #f7c477;
        --color-info: #72a7d8;
        --color-success: #69c99d;
        --color-warning: #e9b95f;
        --color-danger: #e57c78;
        --bg: var(--color-canvas);
        --bg-card: var(--color-surface);
        --bg-hover: var(--color-surface-raised);
        --text: var(--color-text-muted);
        --text-h: var(--color-text);
        --text-muted: var(--color-text-muted);
        --accent: var(--color-accent);
        --accent-light: var(--color-accent-strong);
        --accent-dim: rgba(242, 173, 85, 0.15);
        --accent-glow: rgba(242, 173, 85, 0.35);
        --border: var(--color-border);
        --border-strong: var(--color-border-strong);
        --radius-control: 0.45rem;
        --radius-card: 0.65rem;
        --radius-feature: 0.8rem;
        --font-display: "Bricolage Grotesque", "Inter Tight", system-ui, -apple-system, sans-serif;
        --font-body: "Inter Tight", "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.6;
        color: var(--text);
        background: var(--bg);
        font-feature-settings: "ss01", "cv11";
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a { color: var(--accent-light); text-decoration: none; }
      a:hover { text-decoration: underline; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .btn, .btn-primary, .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.35rem;
        padding: 0.58rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-hover);
        color: var(--text-h);
        font: 600 0.84rem/1.2 var(--font-body);
        text-decoration: none;
        cursor: pointer;
      }
      .btn:hover, .btn-secondary:hover { border-color: var(--border-strong); background: var(--bg-hover); color: var(--text-h); text-decoration: none; }
      .btn-primary { border-color: var(--accent); background: var(--accent); color: #21170d; box-shadow: 0 1px 0 rgba(255,255,255,.18) inset; }
      .btn-primary:hover { border-color: var(--accent-light); background: var(--accent-light); color: #21170d; text-decoration: none; }

      .surface { padding: 1.25rem; border: 1px solid var(--border); border-radius: var(--radius-feature); background: var(--bg-card); }
      .notice {
        display: flex; align-items: baseline; gap: 0.45rem; margin: 1.25rem 0;
        padding: 0.75rem 0.85rem; border: 1px solid var(--border); border-left: 2px solid var(--color-info);
        border-radius: 8px; background: var(--bg-hover); color: var(--text-muted); font-size: 0.82rem;
      }
      .notice strong { color: var(--text-h); }
      .notice-warning { border-left-color: var(--color-warning); }
      .badge {
        display: inline-flex; align-items: center; min-height: 1.45rem; padding: 0.18rem 0.48rem;
        border: 1px solid var(--border); border-radius: 999px; background: var(--bg-hover);
        color: var(--text-muted); font: 650 0.66rem var(--font-body); letter-spacing: 0.05em; text-transform: uppercase;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1.5rem;
        background: var(--bg-card);
        border-bottom: 1px solid var(--border);
      }
      .site-brand {
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--accent-light);
      }
      .site-brand:hover { text-decoration: none; }
      .site-nav { display: flex; align-items: center; gap: 1rem; }
      .site-nav a { color: var(--text); padding: 0.35rem 0.55rem; border-radius: 7px; }
      .site-nav a:hover { color: var(--text-h); background: var(--bg-hover); text-decoration: none; }
      .site-nav .btn-primary { color: #21170d; padding: 0.35rem 0.65rem; }
      .site-menu-button { display: none; width: 2.75rem; height: 2.75rem; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-h); font-size: 1.3rem; cursor: pointer; }

      main {
        flex: 1;
        width: 100%;
        max-width: 46rem;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 4rem;
      }

      h1 {
        font-family: var(--font-display);
        font-weight: 500;
        color: var(--text-h);
        font-size: clamp(2.2rem, 5vw, 3rem);
        line-height: 1.05;
        letter-spacing: -0.045em;
        margin-bottom: 1.5rem;
      }
      @media (max-width: 640px) {
        h1 { font-size: 1.8rem; }
        main { padding: 2rem 1.25rem 3rem; }
      }

      .guide-body h2 {
        font-family: var(--font-display);
        font-weight: 500;
        color: var(--text-h);
        font-size: 1.4rem;
        letter-spacing: -0.01em;
        margin: 2.25rem 0 0.85rem;
      }
      .guide-body h3 {
        font-family: var(--font-display);
        font-weight: 500;
        color: var(--text-h);
        font-size: 1.1rem;
        margin: 1.75rem 0 0.6rem;
      }
      .guide-body p { margin: 0 0 1rem; }
      .guide-body ul, .guide-body ol { margin: 0 0 1rem 1.5rem; }
      .guide-body li { margin: 0 0 0.5rem; }
      .guide-body li > ul, .guide-body li > ol { margin-top: 0.5rem; }
      .guide-body strong { color: var(--text-h); font-weight: 600; }
      .guide-body code {
        font-family: var(--font-mono);
        font-size: 0.9em;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.1em 0.35em;
      }
      /* Code BLOCKS: one card, not per-line fragments. The inline-code
         chrome above applies per line box when the <code> sits inside a
         <pre>, so reset it and style the <pre> instead. */
      .guide-body pre {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.9rem 1.1rem;
        margin: 0 0 1rem;
        overflow-x: auto;
      }
      .guide-body pre code {
        background: none;
        border: none;
        border-radius: 0;
        padding: 0;
        display: block;
        line-height: 1.5;
      }
      .guide-byline {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin: -1rem 0 1.75rem;
      }
      .guide-body a { color: var(--accent-light); }
      .guide-body img {
        display: block;
        width: 100%;
        height: auto;
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--bg-card);
      }
      .guide-body p:has(> img) { margin: 1.5rem 0 0.55rem; }
      .guide-body p:has(> img) + p {
        margin-top: 0;
        color: var(--text-muted);
        font-size: 0.9rem;
        text-align: center;
      }
      .guide-body blockquote {
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-left: 2px solid var(--color-info);
        border-radius: 8px;
        padding: 0.9rem 1.2rem;
        margin: 0 0 1rem;
      }
      .guide-body blockquote p { margin: 0; }
      .guide-body blockquote p + p { margin-top: 0.6rem; }
      .guide-body blockquote a {
        display: inline-block;
        margin-top: 0.35rem;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }
      .guide-body table { width: 100%; margin: 0 0 1rem; border: 1px solid var(--border); border-radius: var(--radius-control); border-collapse: separate; border-spacing: 0; overflow: hidden; font-size: 0.86rem; }
      .guide-body th { padding: 0.6rem 0.7rem; background: var(--bg); color: var(--text-muted); font-size: 0.68rem; font-weight: 650; letter-spacing: 0.05em; text-align: left; text-transform: uppercase; }
      .guide-body td { padding: 0.65rem 0.7rem; border-top: 1px solid var(--border); color: var(--text); }
      .guide-path-tabs {
        margin: 1.25rem 0 2rem;
        padding: 0.4rem;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--bg-card);
      }
      .guide-path-tablist {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.45rem;
      }
      .guide-path-tab {
        min-height: 3rem;
        padding: 0.6rem 0.75rem;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: var(--text-muted);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      .guide-path-tab:hover { color: var(--text-h); background: var(--bg-hover); }
      .guide-path-tab[aria-selected="true"] {
        color: var(--text-h);
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .guide-path-tab:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }
      .guide-path-panel {
        margin-top: 0.4rem;
        padding: 1.35rem 1.2rem 0.35rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
        outline: none;
      }
      .guide-path-panel[hidden] { display: none; }
      .guide-path-panel > h3:first-child { margin-top: 0; }
      @media (max-width: 620px) {
        .guide-path-tablist { grid-template-columns: 1fr; }
        .guide-path-tab { min-height: 2.65rem; text-align: left; }
      }

      .guide-lede {
        color: var(--text-muted);
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .guide-cards {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr;
      }
      @media (min-width: 560px) {
        .guide-cards { grid-template-columns: 1fr 1fr; }
      }
      .guide-card {
        display: block;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.25rem 1.4rem;
        color: var(--text);
        transition: border-color 120ms ease, background 120ms ease;
      }
      .guide-card:hover {
        text-decoration: none;
        border-color: var(--accent);
        background: var(--bg-hover);
      }
      .guide-card h2 {
        font-family: var(--font-display);
        font-weight: 500;
        color: var(--text-h);
        font-size: 1.2rem;
        margin-bottom: 0.4rem;
      }
      .guide-card p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

      @media (max-width: 768px) {
        .site-header { padding: 0.75rem 1rem; }
        .site-menu-button { display: inline-grid; place-items: center; }
        .site-nav {
          position: absolute; top: 100%; left: 0; right: 0; display: none; flex-direction: column;
          align-items: stretch; gap: 0.25rem; padding: 0.75rem 1rem 1rem; border-bottom: 1px solid var(--border);
          background: var(--bg-card); box-shadow: 0 16px 32px rgba(0,0,0,.28);
        }
        .site-nav[data-open="true"] { display: flex; }
        .site-nav a, .site-nav .btn-primary { min-height: 2.75rem; display: flex; align-items: center; padding: 0.55rem 0.75rem; }
      }

      .site-footer {
        border-top: 1px solid var(--border);
        padding: 1.5rem;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.9rem;
      }
      .site-footer p { margin: 0 0 0.35rem; }
      .site-footer p:last-child { margin-bottom: 0; }

      /* Guides index: project shelves + rail nav (design ruling 2026-07-22,
         mockup variant B). --c is set per shelf from the project registry. */
      main:has(.guides-layout) { max-width: 72rem; }

      /* Guide pages: "On this page" rail (2026-07-22, Stef's ask; same
         pattern as a key-takeaways side panel). Sticky next to the article
         on wide screens, a plain link row above it on mobile. */
      main:has(.guide-layout) { max-width: 66rem; }
      .guide-layout { display: grid; grid-template-columns: 13rem minmax(0, 46rem); gap: 3rem; justify-content: center; }
      .guide-toc { position: sticky; top: 2rem; align-self: start; font-size: 0.88rem; }
      .guide-toc-label {
        font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
        letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.9rem;
      }
      .guide-toc a {
        display: block; color: var(--text); padding: 0.32rem 0.6rem; border-radius: 8px;
        border-left: 2px solid var(--border-strong);
      }
      .guide-toc a:hover { background: var(--bg-hover); color: var(--text-h); border-left-color: var(--accent); text-decoration: none; }
      .guide-body h2, .guide-body h3 { scroll-margin-top: 2rem; }
      @media (max-width: 860px) {
        .guide-layout { grid-template-columns: 1fr; gap: 1.25rem; }
        .guide-toc {
          position: static; display: flex; gap: 0.4rem; overflow-x: auto;
          padding-bottom: 0.35rem; scrollbar-width: thin;
        }
        .guide-toc-label { display: none; }
        .guide-toc a {
          display: block; flex: none; border-left: none; border: 1px solid var(--border-strong);
          border-radius: 999px; padding: 0.25rem 0.8rem; margin: 0; font-size: 0.82rem;
        }
      }
      .guides-layout { display: grid; grid-template-columns: 13rem 1fr; gap: 3rem; }
      .guides-rail { position: sticky; top: 2rem; align-self: start; font-size: 0.92rem; }
      .guides-rail-label {
        font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
        letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1rem;
      }
      .guides-rail a {
        display: flex; align-items: center; gap: 0.6rem; color: var(--text);
        padding: 0.4rem 0.6rem; border-radius: 8px;
      }
      .guides-rail a:hover { background: var(--bg-hover); color: var(--text-h); text-decoration: none; }
      .rail-dot { width: 0.55em; height: 0.55em; border-radius: 50%; flex: none; }
      .rail-count { margin-left: auto; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }
      .shelf { margin-bottom: 3.25rem; scroll-margin-top: 2rem; }
      .shelf-head {
        display: flex; align-items: baseline; gap: 0.9rem;
        border-bottom: 1px dashed var(--border-strong); padding-bottom: 0.6rem; margin-bottom: 1.1rem;
      }
      .shelf-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; color: var(--text-h); }
      .shelf-swatch { width: 0.7em; height: 0.7em; border-radius: 50%; align-self: center; background: var(--c); flex: none; }
      .shelf-sub { color: var(--text-muted); font-size: 0.9rem; }
      .shelf-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1rem; }
      .shelf-row.single { grid-template-columns: 1fr; }
      .shelf-card {
        position: relative; display: block; background: var(--bg-card);
        border: 1px solid var(--border); border-radius: 12px; padding: 1.35rem 1.45rem;
        transition: border-color 160ms ease, background 160ms ease; overflow: hidden; color: var(--text);
      }
      .shelf-card::after {
        content: "\2192"; position: absolute; right: 1.2rem; bottom: 0.9rem;
        color: var(--c, var(--accent)); opacity: 0; transition: all 160ms ease; transform: translateX(-4px);
      }
      .shelf-card:hover { border-color: var(--c, var(--accent)); background: var(--bg-hover); text-decoration: none; }
      .shelf-card:hover::after { opacity: 1; transform: none; }
      .shelf-card h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.2rem; color: var(--text-h); margin: 0 0 0.4rem; }
      .shelf-card p { color: var(--text-muted); font-size: 0.95rem; margin: 0; max-width: 34rem; }
      .shelf-kicker {
        font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--c, var(--accent)); display: block; margin-bottom: 0.35rem;
      }
      .shelf-card.featured {
        background: linear-gradient(135deg, color-mix(in srgb, var(--c) 12%, var(--bg-card)), var(--bg-card) 55%);
      }
      .shelf-card.soon { opacity: 0.5; }
      @media (max-width: 860px) {
        .guides-layout { grid-template-columns: 1fr; gap: 1.5rem; }
        .guides-rail { position: static; display: flex; flex-wrap: wrap; gap: 0.25rem; }
        .guides-rail-label { width: 100%; }
        .shelf-row { grid-template-columns: 1fr; }
      }
    </style>
    <style>
      /* Section navigation (2026-08-14): breadcrumbs + a pill switcher so a
         reader always knows where they are inside a section and can move
         sideways without going through the article links. Shared by the
         guide pages and the CTR section. */
      .crumbs {
        font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.04em;
        color: var(--text-muted); margin-bottom: 1.1rem;
      }
      .crumbs a { color: var(--text-muted); }
      .crumbs a:hover { color: var(--text-h); }
      .crumbs .sep { margin: 0 0.45rem; opacity: 0.6; }
      .section-subnav {
        display: flex; gap: 0.2rem; overflow-x: auto; margin-bottom: 1.75rem;
        border-bottom: 1px solid var(--border); scrollbar-width: thin;
      }
      .section-subnav a {
        display: inline-flex; align-items: center; min-height: 2.4rem; flex: none;
        border: 0; border-bottom: 2px solid transparent; padding: 0.5rem 0.65rem;
        font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
      }
      .section-subnav a:hover { color: var(--text-h); text-decoration: none; }
      .section-subnav a.current {
        border-bottom-color: var(--accent); color: var(--text-h); background: transparent;
        pointer-events: none;
      }
      .related-block { border-top: 1px dashed var(--border-strong); margin-top: 3rem; padding-top: 1.75rem; }
      .related-label {
        font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
        letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1rem;
      }

      /* Video embeds (2026-08-16): click-to-play facade, not an auto-loading
         iframe. YouTube (even youtube-nocookie.com) writes to local storage
         and contacts Google on load, and sets cookies once played - both
         need prior consent under GDPR/ePrivacy, and this site has no cookie
         banner by design (see FEAT-31: cookieless analytics). So nothing
         Google-hosted loads until the visitor explicitly clicks: the
         thumbnail is self-hosted, and only the click injects the iframe. */
      .video-embed {
        position: relative; width: 100%; max-width: 42rem; aspect-ratio: 16 / 9;
        margin: 0 0 1.75rem; border-radius: 12px; overflow: hidden;
        border: 1px solid var(--border-strong); background: #000;
      }
      .video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .video-facade {
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0;
        cursor: pointer; background-size: cover; background-position: center;
        display: flex; align-items: center; justify-content: center;
      }
      .video-facade::before {
        content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.3);
        transition: background 120ms ease;
      }
      .video-facade:hover::before { background: rgba(0, 0, 0, 0.15); }
      .video-facade .play-icon {
        position: relative; width: 4.5rem; height: 4.5rem; border-radius: 50%;
        background: var(--accent); display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      }
      .video-facade .play-icon::after {
        content: ""; border-style: solid; border-width: 0.9rem 0 0.9rem 1.5rem;
        border-color: transparent transparent transparent #1a1410; margin-left: 0.35rem;
      }
      .video-facade .facade-note {
        position: absolute; left: 0.9rem; bottom: 0.7rem; color: #fff;
        font-size: 0.78rem; background: rgba(0, 0, 0, 0.55); padding: 0.25rem 0.6rem;
        border-radius: 6px;
      }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="/">Archipelago Pie</a>
      <button class="site-menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">☰</button>
      <nav class="site-nav" id="site-nav">
        <a href="/guides">Guides</a>
        <a href="/apworlds">APWorlds</a>
        <a href="/yaml-builder">YAML Builder</a>
        <a class="btn-primary" href="/api/auth/login">Sign in with Discord</a>
      </nav>

    <main>
      {% block main %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Archipelago Pie, a project home for Archipelago multiworlds. Open source on
        <a href="https://github.com/dowlle/ap-pie" rel="noopener noreferrer">GitHub</a>.</p>
      <p><a href="/privacy">Privacy</a></p>
    </footer>

    <script>
      var menuButton = document.querySelector(".site-menu-button");
      var siteNav = document.querySelector("#site-nav");
      if (menuButton && siteNav) {
        menuButton.addEventListener("click", function () {
          var open = menuButton.getAttribute("aria-expanded") !== "true";
          menuButton.setAttribute("aria-expanded", String(open));
          menuButton.setAttribute("aria-label", open ? "Close menu" : "Open menu");
          siteNav.dataset.open = open ? "true" : "";
        });
        siteNav.addEventListener("click", function () {
          menuButton.setAttribute("aria-expanded", "false");
          menuButton.setAttribute("aria-label", "Open menu");
          siteNav.dataset.open = "";
        });
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape" && menuButton.getAttribute("aria-expanded") === "true") {
            menuButton.setAttribute("aria-expanded", "false");
            menuButton.setAttribute("aria-label", "Open menu");
            siteNav.dataset.open = "";
            menuButton.focus();
          }
        });
      }
      // Click-to-play video facades: nothing Google-hosted loads until this
      // fires, so no consent gate is needed for the facade itself.
      document.querySelectorAll(".video-facade").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var iframe = document.createElement("iframe");
          iframe.src = btn.dataset.embedSrc;
          iframe.title = btn.dataset.embedTitle || "";
          iframe.referrerPolicy = "strict-origin-when-cross-origin";
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
          iframe.allowFullscreen = true;
          iframe.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0";
          btn.replaceWith(iframe);
        }, { once: true });
      });
    </script>
  </body>
</html>
