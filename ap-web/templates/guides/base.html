<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ meta_description }}" />
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="{{ og_type|default('article') }}" />
    <meta property="og:title" content="{{ og_title|default(page_title) }}" />
    <meta property="og:description" content="{{ og_description|default(meta_description) }}" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:site_name" content="Archipelago Pie" />
    <meta name="theme-color" content="#15131a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg: #15131a;
        --bg-card: #1f1c25;
        --bg-hover: #2a2630;
        --text: #d8d4cc;
        --text-h: #f4ecdc;
        --text-muted: #8a8378;
        --accent: #e8a857;
        --accent-light: #f5c987;
        --accent-dim: rgba(232, 168, 87, 0.15);
        --border: #2e2935;
        --border-strong: #3a3340;
        --font-display: "Bricolage Grotesque", "Inter Tight", system-ui, -apple-system, sans-serif;
        --font-body: "Inter Tight", "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.6;
        color: var(--text);
        background: var(--bg);
        font-feature-settings: "ss01", "cv11";
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a { color: var(--accent-light); text-decoration: none; }
      a:hover { text-decoration: underline; }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1.5rem;
        background: var(--bg-card);
        border-bottom: 1px solid var(--border);
      }
      .site-brand {
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--accent-light);
      }
      .site-brand:hover { text-decoration: none; }
      .site-nav { display: flex; align-items: center; gap: 1rem; }
      .site-nav a { color: var(--text); padding: 0.25rem 0.5rem; border-radius: 4px; }
      .site-nav a:hover { color: var(--text-h); background: var(--bg-hover); text-decoration: none; }

      main {
        flex: 1;
        width: 100%;
        max-width: 46rem;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 4rem;
      }

      h1 {
        font-family: var(--font-display);
        font-weight: 500;
        color: var(--text-h);
        font-size: 2.2rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin-bottom: 1.5rem;
      }
      @media (max-width: 640px) {
        h1 { font-size: 1.8rem; }
        main { padding: 2rem 1.25rem 3rem; }
      }

      .guide-body h2 {
        font-family: var(--font-display);
        font-weight: 500;
        color: var(--text-h);
        font-size: 1.4rem;
        letter-spacing: -0.01em;
        margin: 2.25rem 0 0.85rem;
      }
      .guide-body h3 {
        font-family: var(--font-display);
        font-weight: 500;
        color: var(--text-h);
        font-size: 1.1rem;
        margin: 1.75rem 0 0.6rem;
      }
      .guide-body p { margin: 0 0 1rem; }
      .guide-body ul, .guide-body ol { margin: 0 0 1rem 1.5rem; }
      .guide-body li { margin: 0 0 0.5rem; }
      .guide-body li > ul, .guide-body li > ol { margin-top: 0.5rem; }
      .guide-body strong { color: var(--text-h); font-weight: 600; }
      .guide-body code {
        font-family: var(--font-mono);
        font-size: 0.9em;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.1em 0.35em;
      }
      /* Code BLOCKS: one card, not per-line fragments. The inline-code
         chrome above applies per line box when the <code> sits inside a
         <pre>, so reset it and style the <pre> instead. */
      .guide-body pre {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.9rem 1.1rem;
        margin: 0 0 1rem;
        overflow-x: auto;
      }
      .guide-body pre code {
        background: none;
        border: none;
        border-radius: 0;
        padding: 0;
        display: block;
        line-height: 1.5;
      }
      .guide-byline {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin: -1rem 0 1.75rem;
      }
      .guide-body a { color: var(--accent-light); }
      .guide-body blockquote {
        background: var(--accent-dim);
        border: 1px solid var(--border-strong);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        padding: 0.9rem 1.2rem;
        margin: 0 0 1rem;
      }
      .guide-body blockquote p { margin: 0; }
      .guide-body blockquote p + p { margin-top: 0.6rem; }

      .guide-lede {
        color: var(--text-muted);
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .guide-cards {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr;
      }
      @media (min-width: 560px) {
        .guide-cards { grid-template-columns: 1fr 1fr; }
      }
      .guide-card {
        display: block;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.25rem 1.4rem;
        color: var(--text);
        transition: border-color 120ms ease, background 120ms ease;
      }
      .guide-card:hover {
        text-decoration: none;
        border-color: var(--accent);
        background: var(--bg-hover);
      }
      .guide-card h2 {
        font-family: var(--font-display);
        font-weight: 500;
        color: var(--text-h);
        font-size: 1.2rem;
        margin-bottom: 0.4rem;
      }
      .guide-card p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

      .site-footer {
        border-top: 1px solid var(--border);
        padding: 1.5rem;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      /* Guides index: project shelves + rail nav (design ruling 2026-07-22,
         mockup variant B). --c is set per shelf from the project registry. */
      main:has(.guides-layout) { max-width: 72rem; }

      /* Guide pages: "On this page" rail (2026-07-22, Stef's ask; same
         pattern as a key-takeaways side panel). Sticky next to the article
         on wide screens, a plain link row above it on mobile. */
      main:has(.guide-layout) { max-width: 66rem; }
      .guide-layout { display: grid; grid-template-columns: 13rem minmax(0, 46rem); gap: 3rem; justify-content: center; }
      .guide-toc { position: sticky; top: 2rem; align-self: start; font-size: 0.88rem; }
      .guide-toc-label {
        font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
        letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.9rem;
      }
      .guide-toc a {
        display: block; color: var(--text); padding: 0.32rem 0.6rem; border-radius: 8px;
        border-left: 2px solid var(--border-strong);
      }
      .guide-toc a:hover { background: var(--bg-hover); color: var(--text-h); border-left-color: var(--accent); text-decoration: none; }
      .guide-body h2, .guide-body h3 { scroll-margin-top: 2rem; }
      @media (max-width: 860px) {
        .guide-layout { grid-template-columns: 1fr; gap: 1.25rem; }
        .guide-toc { position: static; }
        .guide-toc a { display: inline-block; border-left: none; border: 1px solid var(--border-strong); border-radius: 999px; padding: 0.25rem 0.8rem; margin: 0 0.3rem 0.4rem 0; font-size: 0.82rem; }
      }
      .guides-layout { display: grid; grid-template-columns: 13rem 1fr; gap: 3rem; }
      .guides-rail { position: sticky; top: 2rem; align-self: start; font-size: 0.92rem; }
      .guides-rail-label {
        font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
        letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1rem;
      }
      .guides-rail a {
        display: flex; align-items: center; gap: 0.6rem; color: var(--text);
        padding: 0.4rem 0.6rem; border-radius: 8px;
      }
      .guides-rail a:hover { background: var(--bg-hover); color: var(--text-h); text-decoration: none; }
      .rail-dot { width: 0.55em; height: 0.55em; border-radius: 50%; flex: none; }
      .rail-count { margin-left: auto; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }
      .shelf { margin-bottom: 3.25rem; scroll-margin-top: 2rem; }
      .shelf-head {
        display: flex; align-items: baseline; gap: 0.9rem;
        border-bottom: 1px dashed var(--border-strong); padding-bottom: 0.6rem; margin-bottom: 1.1rem;
      }
      .shelf-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; color: var(--text-h); }
      .shelf-swatch { width: 0.7em; height: 0.7em; border-radius: 50%; align-self: center; background: var(--c); flex: none; }
      .shelf-sub { color: var(--text-muted); font-size: 0.9rem; }
      .shelf-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1rem; }
      .shelf-row.single { grid-template-columns: 1fr; }
      .shelf-card {
        position: relative; display: block; background: var(--bg-card);
        border: 1px solid var(--border); border-radius: 12px; padding: 1.35rem 1.45rem;
        transition: border-color 160ms ease, background 160ms ease; overflow: hidden; color: var(--text);
      }
      .shelf-card::after {
        content: "\2192"; position: absolute; right: 1.2rem; bottom: 0.9rem;
        color: var(--c, var(--accent)); opacity: 0; transition: all 160ms ease; transform: translateX(-4px);
      }
      .shelf-card:hover { border-color: var(--c, var(--accent)); background: var(--bg-hover); text-decoration: none; }
      .shelf-card:hover::after { opacity: 1; transform: none; }
      .shelf-card h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.2rem; color: var(--text-h); margin: 0 0 0.4rem; }
      .shelf-card p { color: var(--text-muted); font-size: 0.95rem; margin: 0; max-width: 34rem; }
      .shelf-kicker {
        font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--c, var(--accent)); display: block; margin-bottom: 0.35rem;
      }
      .shelf-card.featured {
        background: linear-gradient(135deg, color-mix(in srgb, var(--c) 12%, var(--bg-card)), var(--bg-card) 55%);
      }
      .shelf-card.soon { opacity: 0.5; }
      @media (max-width: 860px) {
        .guides-layout { grid-template-columns: 1fr; gap: 1.5rem; }
        .guides-rail { position: static; display: flex; flex-wrap: wrap; gap: 0.25rem; }
        .guides-rail-label { width: 100%; }
        .shelf-row { grid-template-columns: 1fr; }
      }
    </style>
    <style>
      /* Section navigation (2026-08-14): breadcrumbs + a pill switcher so a
         reader always knows where they are inside a section and can move
         sideways without going through the article links. Shared by the
         guide pages and the CTR section. */
      .crumbs {
        font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.04em;
        color: var(--text-muted); margin-bottom: 1.1rem;
      }
      .crumbs a { color: var(--text-muted); }
      .crumbs a:hover { color: var(--text-h); }
      .crumbs .sep { margin: 0 0.45rem; opacity: 0.6; }
      .section-subnav {
        display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.75rem;
      }
      .section-subnav a {
        display: inline-block; border: 1px solid var(--border-strong); border-radius: 999px;
        padding: 0.28rem 0.9rem; font-size: 0.85rem; color: var(--text);
      }
      .section-subnav a:hover { background: var(--bg-hover); color: var(--text-h); border-color: var(--accent); text-decoration: none; }
      .section-subnav a.current {
        border-color: var(--accent); color: var(--accent-light); background: var(--accent-dim);
        pointer-events: none;
      }
      .related-block { border-top: 1px dashed var(--border-strong); margin-top: 3rem; padding-top: 1.75rem; }
      .related-label {
        font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
        letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1rem;
      }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="/">Archipelago Pie</a>
      <nav class="site-nav">
        <a href="/guides">Guides</a>
        <a href="/">Open the app</a>
      </nav>
    </header>

    <main>
      {% block main %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Archipelago Pie, a project home for Archipelago multiworlds. Open source on
        <a href="https://github.com/dowlle/ap-pie" rel="noopener noreferrer">GitHub</a>.</p>
    </footer>
  </body>
</html>
