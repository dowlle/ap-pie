<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archipelago Pie - multiworld lobby &amp; tracker</title>
    <meta name="description" content="Collect YAMLs, generate multiworlds, share connection details. A lobby for Archipelago multiworld randomizer sessions." />

    <!-- Open Graph for Discord / Slack / iMessage previews when a host shares /r/<id> or /play/<seed> -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Archipelago Pie - multiworld lobby &amp; tracker" />
    <meta property="og:description" content="Collect YAMLs, generate multiworlds, share connection details." />
    <!-- ROUTE_META -->
    <meta name="theme-color" content="#15131a" />

    <!-- Type system: Bricolage Grotesque (display) + Inter Tight (body) + JetBrains Mono (code).
         Self-hosted from /fonts via src/fonts.css, so first paint no longer waits on a
         stylesheet from fonts.googleapis.com. Only the two latin faces that every page
         uses are preloaded; the other subsets and JetBrains Mono load on demand through
         their unicode-range and the rules that ask for them. -->
    <link rel="preload" href="/fonts/inter-tight-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/bricolage-grotesque-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"><!-- ROUTE_CONTENT --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
