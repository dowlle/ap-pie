<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">The usual path from a multiworld announcement to play</title>
  <desc id="desc">Six connected steps: Discord announcement, YAML collector, custom APWorld handoff, local generation, upload to archipelago.gg, then connect and play.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1f1c25"/><stop offset="1" stop-color="#18151d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f4ecdc" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="700">From announcement to play</text>
  <path d="M130 231 H1070" fill="none" stroke="#4b4350" stroke-width="4" stroke-dasharray="8 10"/>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(115 155)" filter="url(#shadow)"><rect width="150" height="160" rx="18" fill="#27232d" stroke="#6da8c9" stroke-width="2"/><circle cx="75" cy="48" r="25" fill="#6da8c9" opacity=".18"/><path d="M60 42h30v20H70l-10 8z" fill="none" stroke="#8ec4e2" stroke-width="3" stroke-linejoin="round"/><text x="75" y="101" fill="#f4ecdc" font-size="18" font-weight="700">Announcement</text><text x="75" y="126" fill="#a9a197" font-size="14">Discord rules</text><text x="75" y="146" fill="#a9a197" font-size="14">and deadline</text></g>
    <g transform="translate(300 155)" filter="url(#shadow)"><rect width="150" height="160" rx="18" fill="#27232d" stroke="#e8a857" stroke-width="2"/><circle cx="75" cy="48" r="25" fill="#e8a857" opacity=".16"/><path d="M58 34h34v30H58zM64 43h22M64 51h18M64 59h13" fill="none" stroke="#f5c987" stroke-width="3"/><text x="75" y="101" fill="#f4ecdc" font-size="18" font-weight="700">Collector</text><text x="75" y="126" fill="#a9a197" font-size="14">Submit one YAML</text><text x="75" y="146" fill="#a9a197" font-size="14">for each world</text></g>
    <g transform="translate(485 155)" filter="url(#shadow)"><rect width="150" height="160" rx="18" fill="#27232d" stroke="#c581c5" stroke-width="2"/><circle cx="75" cy="48" r="25" fill="#c581c5" opacity=".16"/><path d="M62 34h22l10 10v22H62zM84 34v11h10" fill="none" stroke="#dfa8df" stroke-width="3"/><text x="75" y="101" fill="#f4ecdc" font-size="18" font-weight="700">Custom worlds</text><text x="75" y="126" fill="#a9a197" font-size="14">Send missing</text><text x="75" y="146" fill="#a9a197" font-size="14">APWorld versions</text></g>
    <g transform="translate(670 155)" filter="url(#shadow)"><rect width="150" height="160" rx="18" fill="#27232d" stroke="#7fa65a" stroke-width="2"/><circle cx="75" cy="48" r="25" fill="#7fa65a" opacity=".16"/><path d="M58 36h34v25H58zM68 68h14M75 61v7" fill="none" stroke="#a4ca80" stroke-width="3"/><text x="75" y="101" fill="#f4ecdc" font-size="18" font-weight="700">Generate locally</text><text x="75" y="126" fill="#a9a197" font-size="14">Host combines</text><text x="75" y="146" fill="#a9a197" font-size="14">all worlds</text></g>
    <g transform="translate(855 155)" filter="url(#shadow)"><rect width="150" height="160" rx="18" fill="#27232d" stroke="#e05d5d" stroke-width="2"/><circle cx="75" cy="48" r="25" fill="#e05d5d" opacity=".15"/><path d="M75 65V35M63 47l12-12 12 12M56 61v9h38v-9" fill="none" stroke="#ef9292" stroke-width="3"/><text x="75" y="101" fill="#f4ecdc" font-size="18" font-weight="700">Upload seed</text><text x="75" y="126" fill="#a9a197" font-size="14">Create room on</text><text x="75" y="146" fill="#a9a197" font-size="14">archipelago.gg</text></g>
    <g transform="translate(1040 155)" filter="url(#shadow)"><rect width="120" height="160" rx="18" fill="#302a25" stroke="#e8a857" stroke-width="2"/><circle cx="60" cy="48" r="25" fill="#e8a857" opacity=".16"/><path d="M45 48h30M60 33v30" fill="none" stroke="#f5c987" stroke-width="3"/><text x="60" y="101" fill="#f4ecdc" font-size="18" font-weight="700">Play</text><text x="60" y="126" fill="#a9a197" font-size="14">Connect with</text><text x="60" y="146" fill="#a9a197" font-size="14">slot details</text></g>
  </g>
  <g fill="#e8a857"><path d="M272 225l12 6-12 6z"/><path d="M457 225l12 6-12 6z"/><path d="M642 225l12 6-12 6z"/><path d="M827 225l12 6-12 6z"/><path d="M1012 225l12 6-12 6z"/></g>
</svg>
