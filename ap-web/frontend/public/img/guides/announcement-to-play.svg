<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">The usual path from a multiworld announcement to play</title>
  <desc id="desc">Six connected steps: Discord announcement, YAML collector, custom APWorld handoff, local generation, upload to archipelago.gg, then connect and play.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1f1c25"/><stop offset="1" stop-color="#18151d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <text x="54" y="55" fill="#f4ecdc" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="700">From announcement to play</text>
  <path d="M145 198H1055" fill="none" stroke="#4b4350" stroke-width="4" stroke-dasharray="8 10"/>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(63 90)" filter="url(#shadow)"><rect width="164" height="205" rx="18" fill="#27232d" stroke="#6da8c9" stroke-width="2"/><circle cx="82" cy="46" r="27" fill="#6da8c9" opacity=".18"/><path d="M67 40h30v20H77l-10 8z" fill="none" stroke="#8ec4e2" stroke-width="3" stroke-linejoin="round"/><text x="82" y="112" fill="#f4ecdc" font-size="18" font-weight="700">Announcement</text><text x="82" y="145" fill="#a9a197" font-size="14">Discord rules</text><text x="82" y="168" fill="#a9a197" font-size="14">and deadline</text></g>
    <g transform="translate(245 90)" filter="url(#shadow)"><rect width="164" height="205" rx="18" fill="#27232d" stroke="#e8a857" stroke-width="2"/><circle cx="82" cy="46" r="27" fill="#e8a857" opacity=".16"/><path d="M65 31h34v30H65zM71 40h22M71 48h18M71 56h13" fill="none" stroke="#f5c987" stroke-width="3"/><text x="82" y="112" fill="#f4ecdc" font-size="18" font-weight="700">Collector</text><text x="82" y="145" fill="#a9a197" font-size="14">Submit one YAML</text><text x="82" y="168" fill="#a9a197" font-size="14">for each world</text></g>
    <g transform="translate(427 90)" filter="url(#shadow)"><rect width="164" height="205" rx="18" fill="#27232d" stroke="#c581c5" stroke-width="2"/><circle cx="82" cy="46" r="27" fill="#c581c5" opacity=".16"/><path d="M69 31h22l10 10v22H69zM91 31v11h10" fill="none" stroke="#dfa8df" stroke-width="3"/><text x="82" y="112" fill="#f4ecdc" font-size="18" font-weight="700">Custom worlds</text><text x="82" y="145" fill="#a9a197" font-size="14">Send missing</text><text x="82" y="168" fill="#a9a197" font-size="14">APWorld versions</text></g>
    <g transform="translate(609 90)" filter="url(#shadow)"><rect width="164" height="205" rx="18" fill="#27232d" stroke="#7fa65a" stroke-width="2"/><circle cx="82" cy="46" r="27" fill="#7fa65a" opacity=".16"/><path d="M65 33h34v25H65zM75 65h14M82 58v7" fill="none" stroke="#a4ca80" stroke-width="3"/><text x="82" y="112" fill="#f4ecdc" font-size="17" font-weight="700">Generate locally</text><text x="82" y="145" fill="#a9a197" font-size="14">Host combines</text><text x="82" y="168" fill="#a9a197" font-size="14">all worlds</text></g>
    <g transform="translate(791 90)" filter="url(#shadow)"><rect width="164" height="205" rx="18" fill="#27232d" stroke="#e05d5d" stroke-width="2"/><circle cx="82" cy="46" r="27" fill="#e05d5d" opacity=".15"/><path d="M82 63V32M70 44l12-12 12 12M63 59v9h38v-9" fill="none" stroke="#ef9292" stroke-width="3"/><text x="82" y="112" fill="#f4ecdc" font-size="18" font-weight="700">Upload seed</text><text x="82" y="145" fill="#a9a197" font-size="14">Create room on</text><text x="82" y="168" fill="#a9a197" font-size="14">archipelago.gg</text></g>
    <g transform="translate(973 90)" filter="url(#shadow)"><rect width="164" height="205" rx="18" fill="#302a25" stroke="#e8a857" stroke-width="2"/><circle cx="82" cy="46" r="27" fill="#e8a857" opacity=".16"/><path d="M67 46h30M82 31v30" fill="none" stroke="#f5c987" stroke-width="3"/><text x="82" y="112" fill="#f4ecdc" font-size="18" font-weight="700">Play</text><text x="82" y="145" fill="#a9a197" font-size="14">Connect with</text><text x="82" y="168" fill="#a9a197" font-size="14">slot details</text></g>
  </g>
  <g fill="#e8a857"><path d="M231 192l12 6-12 6z"/><path d="M413 192l12 6-12 6z"/><path d="M595 192l12 6-12 6z"/><path d="M777 192l12 6-12 6z"/><path d="M959 192l12 6-12 6z"/></g>
</svg>
