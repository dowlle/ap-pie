<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">What to check in a YAML collection room</title>
  <desc id="desc">An anonymized collection-room interface highlighting the deadline and rules, Archipelago and APWorld versions, YAML submission, and custom APWorld instructions.</desc>
  <rect width="1200" height="620" rx="28" fill="#18151d"/>
  <rect x="36" y="32" width="1128" height="556" rx="20" fill="#1f1c25" stroke="#3a3340" stroke-width="2"/>
  <rect x="36" y="32" width="1128" height="62" rx="20" fill="#27232d"/><circle cx="72" cy="63" r="8" fill="#e05d5d"/><circle cx="98" cy="63" r="8" fill="#e8a857"/><circle cx="124" cy="63" r="8" fill="#7fa65a"/>
  <text x="170" y="70" fill="#f4ecdc" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700">Community Sync collection room</text>
  <g font-family="Inter,system-ui,sans-serif">
    <rect x="72" y="126" width="675" height="120" rx="14" fill="#27232d" stroke="#4a4350"/>
    <text x="98" y="160" fill="#e8a857" font-size="14" font-weight="700" letter-spacing="1.3">READ BEFORE SUBMITTING</text>
    <text x="98" y="192" fill="#f4ecdc" font-size="21" font-weight="700">Deadline: Friday at 17:00 UTC</text>
    <text x="98" y="222" fill="#a9a197" font-size="17">Rules, game limits, testing requirements, and start procedure</text>
    <rect x="778" y="126" width="350" height="120" rx="14" fill="#27232d" stroke="#6da8c9"/>
    <text x="804" y="160" fill="#8ec4e2" font-size="14" font-weight="700" letter-spacing="1.3">VERSION POLICY</text>
    <text x="804" y="193" fill="#f4ecdc" font-size="20" font-weight="700">Archipelago 0.6.x</text>
    <text x="804" y="222" fill="#a9a197" font-size="17">APWorlds freeze before closing</text>
    <rect x="72" y="276" width="675" height="250" rx="14" fill="#211e27" stroke="#3a3340"/>
    <text x="98" y="315" fill="#f4ecdc" font-size="21" font-weight="700">Submitted worlds</text>
    <text x="654" y="315" fill="#a9a197" font-size="15" text-anchor="end">3 worlds</text>
    <g font-size="17"><rect x="98" y="339" width="623" height="48" rx="9" fill="#2a2630"/><circle cx="124" cy="363" r="8" fill="#7fa65a"/><text x="147" y="369" fill="#f4ecdc">RiverRunner</text><text x="690" y="369" fill="#a9a197" text-anchor="end">A Hat in Time</text>
    <rect x="98" y="399" width="623" height="48" rx="9" fill="#2a2630"/><circle cx="124" cy="423" r="8" fill="#7fa65a"/><text x="147" y="429" fill="#f4ecdc">KartFan</text><text x="690" y="429" fill="#a9a197" text-anchor="end">Crash Team Racing</text>
    <rect x="98" y="459" width="623" height="48" rx="9" fill="#302a25" stroke="#e8a857"/><circle cx="124" cy="483" r="8" fill="#e8a857"/><text x="147" y="489" fill="#f4ecdc">PuzzleSide</text><text x="690" y="489" fill="#f5c987" text-anchor="end">Custom APWorld</text></g>
    <rect x="778" y="276" width="350" height="250" rx="14" fill="#27232d" stroke="#e8a857"/>
    <text x="804" y="315" fill="#e8a857" font-size="14" font-weight="700" letter-spacing="1.3">YOUR CHECKLIST</text>
    <g fill="#f4ecdc" font-size="17"><text x="842" y="356">Read every host rule</text><text x="842" y="398">Use the listed versions</text><text x="842" y="440">Submit before the deadline</text><text x="842" y="482">Send missing APWorlds early</text></g>
    <g fill="none" stroke="#7fa65a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M806 347l7 7 14-17"/><path d="M806 389l7 7 14-17"/><path d="M806 431l7 7 14-17"/><path d="M806 473l7 7 14-17"/></g>
  </g>
  <text x="600" y="568" fill="#9b9388" font-family="Inter,system-ui,sans-serif" font-size="15" text-anchor="middle">An anonymized example. Each host and collector may present these details differently.</text>
</svg>
