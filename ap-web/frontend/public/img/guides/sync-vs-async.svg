<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Synchronized and asynchronous multiworlds after generation</title>
  <desc id="desc">Both formats share generation and room upload. Synchronized games use a countdown before locations are sent. Asynchronous games open for play and use ongoing tracker, activity, and hint rules.</desc>
  <rect width="1200" height="500" rx="28" fill="#18151d"/>
  <text x="600" y="55" fill="#f4ecdc" font-family="Inter,system-ui,sans-serif" font-size="29" font-weight="700" text-anchor="middle">After generation, the event format changes what happens next</text>
  <rect x="70" y="90" width="1060" height="68" rx="16" fill="#27232d" stroke="#e8a857"/>
  <text x="600" y="118" fill="#e8a857" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">SHARED HANDOFF</text>
  <text x="600" y="143" fill="#f4ecdc" font-family="Inter,system-ui,sans-serif" font-size="19" text-anchor="middle">Host uploads the successful seed, then shares the room address and slot details</text>
  <path d="M600 158v38M600 196H320v28M600 196h280v28" fill="none" stroke="#4b4350" stroke-width="4"/>
  <g font-family="Inter,system-ui,sans-serif">
    <rect x="70" y="224" width="500" height="220" rx="20" fill="#211e27" stroke="#6da8c9" stroke-width="2"/>
    <circle cx="122" cy="274" r="28" fill="#6da8c9" opacity=".18"/><path d="M122 258v18l13 8" fill="none" stroke="#8ec4e2" stroke-width="4" stroke-linecap="round"/>
    <text x="166" y="270" fill="#8ec4e2" font-size="14" font-weight="700" letter-spacing="1.3">SYNCHRONIZED</text>
    <text x="166" y="298" fill="#f4ecdc" font-size="24" font-weight="700">Everyone starts together</text>
    <g fill="#c8c0b7" font-size="18"><text x="104" y="345">1. Connect only when the host allows it</text><text x="104" y="378">2. Wait for the countdown</text><text x="104" y="411">3. Start playing and sending locations</text></g>
    <rect x="630" y="224" width="500" height="220" rx="20" fill="#211e27" stroke="#7fa65a" stroke-width="2"/>
    <circle cx="682" cy="274" r="28" fill="#7fa65a" opacity=".18"/><path d="M667 273h30M682 258v30" fill="none" stroke="#a4ca80" stroke-width="4" stroke-linecap="round"/>
    <text x="726" y="270" fill="#a4ca80" font-size="14" font-weight="700" letter-spacing="1.3">ASYNCHRONOUS</text>
    <text x="726" y="298" fill="#f4ecdc" font-size="24" font-weight="700">Play on your own schedule</text>
    <g fill="#c8c0b7" font-size="18"><text x="664" y="345">1. Open the published room and trackers</text><text x="664" y="378">2. Claim slots when required</text><text x="664" y="411">3. Follow activity, update, and hint rules</text></g>
  </g>
  <text x="600" y="480" fill="#9b9388" font-family="Inter,system-ui,sans-serif" font-size="15" text-anchor="middle">The host announcement is authoritative for both formats.</text>
</svg>
